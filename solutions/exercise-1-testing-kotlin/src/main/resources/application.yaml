server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/c8-dev-training
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    io.camunda.zeebe.client.impl.ZeebeCallCredentials: ERROR